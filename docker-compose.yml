services:
  redis:
    image: redis:alpine
    container_name: kener_redis
    restart: unless-stopped
    networks:
      - kener_internal

  kener:
    image: rajnandan1/kener:latest
    container_name: kener_status
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - PROM_BASIC_AUTH=${PROM_BASIC_AUTH}
      - REDIS_URL=redis://redis:6379/0
      - KENER_SECRET_KEY=${KENER_SECRET_KEY}
      - ORIGIN=https://status.waterlilith.space
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_SECURE=${SMTP_SECURE}
    volumes:
      - kener_db:/app/database
    networks:
      - default # egress to Grafana Cloud
      - kener_internal # redis
      - app_net # prod API + prod cloudflared
      - dev_net # staging API

volumes:
  kener_db:

networks:
  kener_internal:
  app_net:
    external: true
    name: hz_app_prod
  dev_net:
    external: true
    name: hz_app_staging
