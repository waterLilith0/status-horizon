services:
  redis:
    image: redis:alpine
    container_name: kener_redis
    restart: unless-stopped
    networks:
      - app_net

  kener:
    image: rajnandan1/kener:latest
    container_name: kener_status
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - REDIS_URL=redis://redis:6379/0
      - KENER_SECRET_KEY=${KENER_SECRET_KEY}
      - ORIGIN=https://status.waterlilith.space
    volumes:
      - kener_db:/app/database
    networks:
      - app_net
      - dev_net

volumes:
  kener_db:

networks:
  app_net:
    external: true
    name: hz_app_prod
  dev_net:
    external: true
    name: hz_app_staging
