services:
  kener:
    image: rajnandan1/kener:latest
    container_name: kener_status
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - NODE_ENV=production
      - GRAFANA_PROM_USER=3130188
      - GRAFANA_API_KEY=${API_KEY}
    volumes:
      - ./config:/config
    networks:
      - app_net
      - dev_net

networks:
  app_net:
    external: true
    name: hz_app_prod # <-- This is the fix! It tells Docker the real name of the network.
  dev_net:
    external: true
    name: hz_app_staging
